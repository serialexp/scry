# The scry query daemon (`scry query`) — the architectural counterpart to
# `scry ingest`. It serves scry-server::QueryService over the binschema-over-TCP
# wire on :4100, reading parquet blocks straight from the object-storage bucket.
# Clients connect with `scry get --remote <addr>:4100`.
#
# Single replica. The daemon keeps its own SQLite catalog (NOT shared with the
# ingest server's WAL volume) on an emptyDir. On a cold boot it restores the
# catalog from the bucket snapshot the ingester uploads (D-055) in one GET —
# `_catalog/snapshot.sqlite` — instead of walking every block sidecar, then its
# own built-in poll + full-walk convergence loops keep it fresh (no seed init
# container or reconcile sidecar needed). The catalog is fully rebuildable from
# the bucket, so the emptyDir stays — no PVC.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scry-query
  namespace: scry
  labels:
    app: scry-query
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scry-query
  template:
    metadata:
      labels:
        app: scry-query
    spec:
      # Give queryd time to stop accepting work and finish bounded cleanup after
      # Kubernetes sends SIGTERM. The daemon handles both SIGTERM and SIGINT.
      terminationGracePeriodSeconds: 30
      # The image runs as UID 65532 (distroless :nonroot). fsGroup makes the
      # kubelet chown the emptyDir to that group on mount so the non-root
      # process can write the SQLite catalog + WAL.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: query
          image: serialexp/scry:latest
          imagePullPolicy: IfNotPresent
          command:
            - scry
            - query
            # Bind all interfaces (default is loopback) so the ClusterIP
            # Service can route to the pod IP. Not publicly exposed — the pod
            # network is cluster-internal and the Service is ClusterIP-only.
            - --listen
            - 0.0.0.0:4100
            - --catalog
            - /catalog/catalog.sqlite
          envFrom:
            - secretRef:
                name: scry-objstore
          ports:
            - name: query
              containerPort: 4100
          # The listener only opens after the one-object catalog snapshot restore
          # finishes. Until then the pod is Running but unready, and startup logs
          # remain visible from the main container. A TCP probe intentionally
          # connects and closes without speaking QueryFrame; queryd treats that
          # clean EOF as debug-level probe traffic, not a warning.
          readinessProbe:
            tcpSocket:
              port: 4100
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              # Defaults total more than this pod: 1 GiB DataFusion + 256 MiB
              # postings + 256 MiB result + 64 MiB bloom, before runtime/SQLite.
              # Keep explicit budgets below the cgroup limit; the 256 MiB cgroup
              # reserve then rejects work before Linux has to OOM-kill queryd.
              memory: "1536Mi"
          args:
            - --query-memory-budget-mib=768
            - --postings-cache-bytes=134217728
            - --query-cache-bytes=134217728
            - --bloom-cache-bytes=33554432
          volumeMounts:
            - name: catalog
              mountPath: /catalog
      volumes:
        - name: catalog
          emptyDir: {}
