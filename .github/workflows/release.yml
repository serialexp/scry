name: Release

# just-release owns both phases: ordinary main commits create/update its release
# PR, while a merged release commit enters post-release mode and publishes. The
# distributable builds are gated to post-release commits so publication only
# happens after every artifact succeeds.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  image:
    if: >-
      startsWith(github.event.head_commit.message, 'release:') ||
      (startsWith(github.event.head_commit.message, 'Merge') && contains(github.event.head_commit.message, 'release/'))
    runs-on: depot-ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: depot/setup-action@v1
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push image
        shell: bash
        run: |
          set -euo pipefail
          version=$(awk '
            /^\[workspace\.package\]$/ { in_section=1; next }
            in_section && /^\[/ { exit }
            in_section && /^version[[:space:]]*=/ {
              sub(/^[^"]*"/, ""); sub(/".*/, ""); print; exit
            }
          ' Cargo.toml)
          TAG="v$version" PUSH_LATEST=true depot bake --push

  cli:
    if: >-
      startsWith(github.event.head_commit.message, 'release:') ||
      (startsWith(github.event.head_commit.message, 'Merge') && contains(github.event.head_commit.message, 'release/'))
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            os: linux
            arch: x86_64
            cross: true
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            os: linux
            arch: aarch64
            cross: true
          - target: x86_64-apple-darwin
            runner: macos-latest
            os: macos
            arch: x86_64
            cross: false
          - target: aarch64-apple-darwin
            runner: macos-latest
            os: macos
            arch: aarch64
            cross: false
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          key: cli-${{ matrix.target }}
      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Build static Linux binary
        if: matrix.cross
        run: cross build --release -p scry --target ${{ matrix.target }}
      - name: Build native binary
        if: ${{ !matrix.cross }}
        run: cargo build --release -p scry --target ${{ matrix.target }}
      - name: Package tarball and checksum
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version=$(awk '
            /^\[workspace\.package\]$/ { in_section=1; next }
            in_section && /^\[/ { exit }
            in_section && /^version[[:space:]]*=/ {
              sub(/^[^"]*"/, ""); sub(/".*/, ""); print; exit
            }
          ' Cargo.toml)
          asset="scry-${version}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/scry" dist/
          cp README.md dist/
          tar -czf "$asset" -C dist .
          if command -v sha256sum >/dev/null; then
            sha256sum "$asset" > "${asset}.sha256"
          else
            shasum -a 256 "$asset" > "${asset}.sha256"
          fi
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            ${{ steps.package.outputs.asset }}
            ${{ steps.package.outputs.asset }}.sha256
          if-no-files-found: error

  release:
    needs: [image, cli]
    if: >-
      always() && !cancelled() &&
      (needs.image.result == 'success' || needs.image.result == 'skipped') &&
      (needs.cli.result == 'success' || needs.cli.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run just-release
        run: npx --yes just-release@0.18.0
        env:
          CI: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
