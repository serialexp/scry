name: Release

# Publication is driven by a merged just-release PR, not by a manually-pushed
# tag. A `release: X.Y.Z` commit on main builds every distributable first; only
# after all builds succeed does just-release create vX.Y.Z and the GitHub Release
# and attach this run's artifacts. Ordinary main pushes make every publish job a
# no-op (release-pr.yml handles those).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_ref:
        description: Release commit SHA to retry after a failed or skipped publication
        required: true
        type: string

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release: ${{ steps.release.outputs.release }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_ref || github.sha }}

      - name: Detect merged release commit
        id: release
        shell: bash
        run: |
          set -euo pipefail
          release_version=""
          # GitHub appends ` (#N)` to the subject of squash-merged PRs by
          # default. Accept that suffix while keeping the release version itself
          # strictly anchored and validated against Cargo.toml below.
          release_subject='^release: ([0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?)( \(#[0-9]+\))?$'
          subject=$(git log -1 --format=%s)
          if [[ "$subject" =~ $release_subject ]]; then
            release_version="${BASH_REMATCH[1]}"
          elif [ "$(git rev-list --parents -n 1 HEAD | wc -w)" -ge 3 ]; then
            while read -r parent_subject; do
              if [[ "$parent_subject" =~ $release_subject ]]; then
                release_version="${BASH_REMATCH[1]}"
                break
              fi
            done < <(git log -1 --format=%P | xargs -n1 git log -1 --format=%s)
          fi

          if [ -z "$release_version" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "HEAD is not a just-release commit; nothing to publish"
            exit 0
          fi

          workspace_version=$(awk '
            /^\[workspace\.package\]$/ { in_section=1; next }
            in_section && /^\[/ { exit }
            in_section && /^version[[:space:]]*=/ {
              sub(/^[^"]*"/, ""); sub(/".*/, ""); print; exit
            }
          ' Cargo.toml)
          if [ "$release_version" != "$workspace_version" ]; then
            echo "::error::release commit version $release_version != workspace version $workspace_version"
            exit 1
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "version=$release_version" >> "$GITHUB_OUTPUT"
          echo "tag=v$release_version" >> "$GITHUB_OUTPUT"

  image:
    needs: detect
    if: needs.detect.outputs.release == 'true'
    runs-on: depot-ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref || github.sha }}
      - uses: depot/setup-action@v1
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push image
        run: depot bake --push
        env:
          TAG: ${{ needs.detect.outputs.tag }}
          PUSH_LATEST: "true"

  cli:
    needs: detect
    if: needs.detect.outputs.release == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            os: linux
            arch: x86_64
            cross: true
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            os: linux
            arch: aarch64
            cross: true
          - target: x86_64-apple-darwin
            runner: macos-latest
            os: macos
            arch: x86_64
            cross: false
          - target: aarch64-apple-darwin
            runner: macos-latest
            os: macos
            arch: aarch64
            cross: false
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          key: cli-${{ matrix.target }}
      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Build static Linux binary
        if: matrix.cross
        run: cross build --release -p scry --target ${{ matrix.target }} --locked
      - name: Build native binary
        if: ${{ !matrix.cross }}
        run: cargo build --release -p scry --target ${{ matrix.target }} --locked
      - name: Package tarball and checksum
        id: package
        shell: bash
        run: |
          set -euo pipefail
          asset="scry-${{ needs.detect.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/scry" dist/
          cp README.md dist/
          tar -czf "$asset" -C dist .
          if command -v sha256sum >/dev/null; then
            sha256sum "$asset" > "${asset}.sha256"
          else
            shasum -a 256 "$asset" > "${asset}.sha256"
          fi
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            ${{ steps.package.outputs.asset }}
            ${{ steps.package.outputs.asset }}.sha256
          if-no-files-found: error

  publish:
    needs: [detect, image, cli]
    if: needs.detect.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create tag and GitHub Release
        # No CARGO_REGISTRY_TOKEN: Scry publishes binaries and an image, not its
        # internal workspace crates. just-release therefore skips crates.io.
        run: npx --yes just-release@0.18.0
        env:
          CI: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
