name: Release

# One tag, everything built. Push a `vX.Y.Z` tag (or run manually) and this:
#   • builds + pushes the server container image via Depot (`depot bake`), and
#   • builds the Tauri desktop app bundles for macOS / Linux / Windows and
#     attaches them to a draft GitHub Release.
#
# Both run on Depot infrastructure. The `serialexp` org is connected to Depot
# GitHub Actions runners (used by the desktop matrix); the image build uses
# Depot's remote BuildKit builders via the depot CLI.
#
# PREREQUISITES (one-time, dashboard/secrets — not doable from code):
#   1. Image build auth — OIDC. In the Depot dashboard for the `scry` project
#      (id in depot.json), add a trust relationship: GitHub → org `serialexp`
#      → repo `scry`. That lets `depot bake` authenticate with no stored token.
#      (Fallback: set a `DEPOT_TOKEN` repo/org secret and drop the id-token
#      permission.)
#   2. Docker Hub push — set repo/org secrets `DOCKERHUB_USERNAME` and
#      `DOCKERHUB_TOKEN` (a Docker Hub access token with write on
#      docker.io/serialexp/scry).
#
# Note: the desktop bundle's embedded version comes from
# desktop/src-tauri/tauri.conf.json, not the git tag — bump it there when you
# want the asset filenames to match the release tag.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ── Server container image (Depot remote build → Docker Hub) ───────────
  image:
    runs-on: depot-ubuntu-22.04
    permissions:
      contents: read
      id-token: write          # OIDC token for depot auth (see prereq #1)
    steps:
      - uses: actions/checkout@v4

      - name: Install Depot CLI
        uses: depot/setup-action@v1

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        # Reads the project id from depot.json and the targets from
        # docker-bake.hcl. TAG flows into the image tag; PUSH_LATEST also
        # moves :latest, so a vX.Y.Z tag publishes both :<tag> and :latest.
        run: depot bake --push
        env:
          TAG: ${{ github.ref_name }}
          PUSH_LATEST: "true"

  # ── Desktop app bundles (Tauri, per-platform) ──────────────────────────
  desktop:
    permissions:
      contents: write          # create the GitHub Release + upload assets
    strategy:
      fail-fast: false
      matrix:
        include:
          # GitHub-hosted macOS runners (Apple Silicon). NOT depot-macos-latest:
          # the DMG bundler (bundle_dmg.sh → Finder/AppleScript + hdiutil) fails
          # on Depot's macOS runners but works on GitHub's, same as our other
          # Tauri apps. The image job below still uses Depot runners.
          - platform: 'macos-latest'           # Apple Silicon (native)
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'           # Intel (cross-compiled from ARM)
            args: '--target x86_64-apple-darwin'
          - platform: 'depot-ubuntu-22.04'
            args: ''
          - platform: 'depot-windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Stamp bundle version from tag
        # Tag builds carry the real version in the bundles/installers; manual
        # (branch) dispatch keeps the placeholder in tauri.conf.json.
        if: github.ref_type == 'tag'
        shell: bash
        working-directory: desktop
        run: bun scripts/stamp-version.mjs "${{ github.ref_name }}"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './desktop/src-tauri -> target'

      - name: Install Linux dependencies (Ubuntu only)
        if: matrix.platform == 'depot-ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'scry ${{ github.ref_name }}'
          releaseBody: 'scry desktop query app. Download the asset for your platform, or run the installer (see desktop/README.md).'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # ── CLI / server binary tarballs (static musl Linux + native macOS) ────
  # Ships the headless `scry` multicall binary as per-platform tarballs
  # attached to the SAME draft Release the desktop job creates (softprops is
  # get-or-create-by-tag and idempotently appends assets). Installed by the
  # repo-root install.sh. Linux legs are fully-static musl builds (scry is
  # rustls-only, no OpenSSL) via `cross`, so one binary per arch runs on any
  # distro regardless of glibc; macOS builds natively on the Apple-Silicon
  # runner (the x86_64 leg cross-compiles, same as the desktop matrix).
  cli:
    permissions:
      contents: write          # upload assets to the Release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            os: linux
            arch: x86_64
            cross: true
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            os: linux
            arch: aarch64
            cross: true
          - target: x86_64-apple-darwin
            runner: macos-latest
            os: macos
            arch: x86_64
            cross: false
          - target: aarch64-apple-darwin
            runner: macos-latest
            os: macos
            arch: aarch64
            cross: false

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version + guard against tag/workspace drift
        id: version
        shell: bash
        run: |
          # On a tag build, assert the tag matches [workspace.package].version
          # (release.sh keeps them in lockstep). Manual dispatch off a branch
          # just uses the workspace version verbatim.
          ws_version=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [ "$tag_version" != "$ws_version" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} != workspace version ${ws_version} (run scripts/release.sh)"
              exit 1
            fi
          fi
          echo "VERSION=${ws_version}" >> "$GITHUB_OUTPUT"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          key: cli-${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build (cross, static musl)
        if: matrix.cross
        run: cross build --release -p scry --target ${{ matrix.target }} --locked

      - name: Build (cargo, native)
        if: ${{ !matrix.cross }}
        run: cargo build --release -p scry --target ${{ matrix.target }} --locked

      - name: Package tarball + checksum
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.VERSION }}"
          asset="scry-${version}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/scry" dist/
          cp README.md dist/
          tar -czf "$asset" -C dist .
          if command -v sha256sum >/dev/null; then
            sha256sum "$asset" > "${asset}.sha256"
          else
            shasum -a 256 "$asset" > "${asset}.sha256"
          fi
          echo "ASSET=${asset}" >> "$GITHUB_OUTPUT"

      - name: Attach to the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          # Same tag ⇒ same (draft) Release the desktop job created; assets are
          # appended. Kept draft so Bart publishes once after review.
          draft: true
          files: |
            ${{ steps.package.outputs.ASSET }}
            ${{ steps.package.outputs.ASSET }}.sha256

      - name: Upload workflow artifact (non-tag dispatch)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            ${{ steps.package.outputs.ASSET }}
            ${{ steps.package.outputs.ASSET }}.sha256
