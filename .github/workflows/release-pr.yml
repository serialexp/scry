name: Release PR

# Every ordinary main update refreshes one just-release PR. Merging that PR is
# the only release action a maintainer takes; release.yml handles publication.
# Repository prerequisite: Settings → Actions → General must allow GitHub
# Actions to create and approve pull requests.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: release-pr
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect an already-merged release
        id: boundary
        shell: bash
        run: |
          set -euo pipefail
          is_release=false
          if git log -1 --format=%s | grep -Eq '^release: [0-9]+\.[0-9]+\.[0-9]+'; then
            is_release=true
          elif [ "$(git rev-list --parents -n 1 HEAD | wc -w)" -ge 3 ]; then
            while read -r parent; do
              if git log -1 --format=%s "$parent" | grep -Eq '^release: [0-9]+\.[0-9]+\.[0-9]+'; then
                is_release=true
                break
              fi
            done < <(git log -1 --format=%P | tr ' ' '\n')
          fi
          echo "release=$is_release" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.boundary.outputs.release != 'true'
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        if: steps.boundary.outputs.release != 'true'

      - name: Create or update release PR
        if: steps.boundary.outputs.release != 'true'
        run: npx --yes just-release@0.18.0
        env:
          CI: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Synchronize Scry's generated versions
        if: steps.boundary.outputs.release != 'true'
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          branch=$(git branch --show-current)
          if [[ "$branch" != release/* ]]; then
            echo "just-release found nothing releasable"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # binschema-runtime is vendored and tracks upstream, not Scry's version.
          git checkout origin/main -- crates/binschema-runtime/Cargo.toml
          version=${branch_version:-$(git log -1 --format=%s | sed -nE 's/^release: ([0-9][0-9A-Za-z.+-]*)$/\1/p')}
          [ -n "$version" ] || { echo "cannot read release version from HEAD" >&2; exit 1; }
          python3 scripts/release-notes.py "$version"
          node scripts/stamp-version.mjs
          # Cargo refreshes only stale workspace package entries while retaining
          # the already-locked dependency graph; the second check proves it.
          cargo check --workspace
          cargo check --workspace --locked

          git add CHANGELOG.md Cargo.toml Cargo.lock crates/binschema-runtime/Cargo.toml \
            desktop/package.json desktop/src-tauri/tauri.conf.json
          if ! git diff --cached --quiet; then
            git commit --amend --no-edit
            git push --force-with-lease origin "HEAD:$branch"
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # PRs opened with GITHUB_TOKEN do not emit another pull_request event, so
      # explicitly dispatch CI on the amended head. The resulting check suite is
      # attached to that release commit and can satisfy branch protection.
      - name: Run CI for the bot-updated release commit
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.sync.outputs.branch }}
        run: gh workflow run ci.yml --ref "$BRANCH"
