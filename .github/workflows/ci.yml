name: CI

# Build + lint + test on every push to main and every PR. Release publication
# is separately driven by a merged just-release PR.
# Runs on Depot GitHub Actions runners, same as release.yml.
#
# Scope: the core cargo workspace (the desktop crate is excluded from the
# workspace and checked separately below). The ordinary Rust job is hermetic:
# Valkey tests are gated and the S3-compat test runtime-skips without env. A
# separate SeaweedFS job below exercises conditional S3 semantics. The MULTI/
# smoke end-to-end (scripts/smoke.sh, needs SeaweedFS + Valkey) is not run here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Rust workspace: build, clippy, test ────────────────────────────────
  rust:
    runs-on: depot-ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2

      - name: Format check (non-blocking)
        # The tree isn't rustfmt-enforced; surface drift as an annotation
        # without failing the build.
        continue-on-error: true
        run: cargo fmt --all --check

      - name: Clippy
        # Not `-D warnings` yet: there are pre-existing warnings, several in
        # the vendored (generated) binschema-runtime crate. Reports lints
        # without gating until a cleanup pass lands.
        run: cargo clippy --workspace --all-targets

      - name: Build
        # just-release updates workspace manifest versions but intentionally does
        # not rewrite Cargo.lock; Cargo refreshes those local package entries here.
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

  # ── S3 compatibility: real conditional create + ETag CAS ───────────────
  s3-compat:
    runs-on: depot-ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2

      - name: Install AWS CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y awscli

      - name: Start SeaweedFS
        run: scripts/dev-seaweedfs-up.sh

      - name: Test S3 compatibility contract
        run: |
          set -a
          source docker/seaweedfs/.env
          set +a
          SCRY_S3_COMPAT_REQUIRED=1 cargo test -p scry-objstore --test s3_compat -- --nocapture

      - name: Show SeaweedFS logs on failure
        if: failure()
        run: docker compose -f docker/seaweedfs/docker-compose.yml logs --no-color

      - name: Stop SeaweedFS
        if: always()
        run: scripts/dev-seaweedfs-down.sh

  # ── Desktop app: TypeScript typecheck + frontend build ─────────────────
  desktop:
    runs-on: depot-ubuntu-22.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build frontend
        run: bun run build
