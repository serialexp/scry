[package]
name        = "scry-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Fan-out observability gateway for OTLP, Loki, Prometheus remote-write, Pyroscope, and the native scry wire."

[[bin]]
name = "scry-gateway-probe"
path = "src/bin/probe.rs"

[dependencies]
anyhow               = { workspace = true }
async-trait           = { workspace = true }
axum                 = { workspace = true }
base64               = { workspace = true }
binschema-runtime   = { workspace = true }
bytes               = { workspace = true }
chrono              = { workspace = true }
clap                = { workspace = true }
flate2              = { workspace = true }
opentelemetry-proto = { workspace = true }
prost               = { workspace = true }
reqwest             = { workspace = true }
scry-duration         = { workspace = true }
scry-client         = { workspace = true }
scry-httpsig        = { workspace = true }
scry-proto          = { workspace = true }
scry-status         = { workspace = true }
scry-valkey         = { workspace = true }
serde               = { workspace = true, features = ["derive"] }
serde_json          = { workspace = true }
snap                = { workspace = true }
tokio               = { workspace = true }
tonic               = { workspace = true }
tracing             = { workspace = true }
uuid                = { workspace = true }
zstd                = { workspace = true }

[lints]
workspace = true
