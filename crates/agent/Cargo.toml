[package]
name        = "scry-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Scry node agent: ships CRI logs, scraped Prometheus metrics, and pod-selected pprof over the native wire."

[lib]
name = "scry_agent"
path = "src/lib.rs"

[dependencies]
anyhow            = { workspace = true }
chrono            = { workspace = true }
clap              = { workspace = true, features = ["env"] }
futures           = { workspace = true }
flate2            = { workspace = true }
k8s-openapi       = { workspace = true }
kube              = { workspace = true }
prost             = { workspace = true }
reqwest           = { workspace = true, features = ["stream"] }
scry-duration       = { workspace = true }
scry-client       = { workspace = true }
scry-match        = { workspace = true }
scry-proto        = { workspace = true }
serde             = { workspace = true, features = ["derive"] }
serde_json        = { workspace = true }
tokio             = { workspace = true }
toml              = { workspace = true }
tracing           = { workspace = true }
tracing-subscriber = { workspace = true }
uuid              = { workspace = true }
zstd              = { workspace = true }

[lints]
workspace = true
