[package]
name = "scry-errorsd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Error-control role runtime foundation: deployment identity, startup guards, status, and shutdown."

[lib]
name = "scry_errorsd"
path = "src/lib.rs"

[dependencies]
anyhow       = { workspace = true }
arrow        = { workspace = true }
bytes        = { workspace = true }
clap         = { workspace = true, features = ["env"] }
fs2          = "0.4"
futures      = { workspace = true }
object_store = { workspace = true }
parquet      = { workspace = true }
scry-block   = { workspace = true }
scry-catalog = { workspace = true }
scry-errors  = { workspace = true }
scry-objstore = { workspace = true }
scry-proto   = { workspace = true }
scry-status  = { workspace = true }
scry-storage-layout = { workspace = true }
serde        = { workspace = true, features = ["derive"] }
serde_json   = { workspace = true }
tokio        = { workspace = true }
tracing      = { workspace = true }
uuid         = { workspace = true, features = ["v4"] }

[dev-dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
tempfile = "3"

[lints]
workspace = true
