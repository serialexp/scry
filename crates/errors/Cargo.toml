[package]
name = "scry-errors"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pure error occurrence identity, extraction, scrubbing, canonicalization, and folding."

[dependencies]
anyhow = { workspace = true }
arrow = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
object_store = { workspace = true }
parquet = { workspace = true }
regex = { workspace = true }
rusqlite = { version = "0.31", features = ["bundled"] }
scry-block = { workspace = true }
scry-catalog = { workspace = true }
scry-objstore = { workspace = true }
scry-proto = { workspace = true }
scry-storage-layout = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = "0.10"
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
unicode-normalization = "0.1"
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true }

[lints]
workspace = true
